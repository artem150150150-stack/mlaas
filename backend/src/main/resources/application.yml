spring:
  application:
    name: lumenml-backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
  datasource:
    url: jdbc:postgresql://localhost:5432/lumenml
    username: lumenml
    password: lumenml
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080

lumenml:
  jwt:
    secret: ${JWT_SECRET:change-me-use-at-least-256-bits-for-production-secret-key-please}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  storage:
    datasets-dir: ${DATASETS_DIR:./data/datasets}
  rabbit:
    training-exchange: lumenml.training
    training-routing-key: training.request
    notification-exchange: lumenml.notifications
    metrics-exchange: lumenml.metrics
  rate-limit:
    capacity: 120
    refill-per-minute: 120

logging:
  level:
    root: INFO
    com.lumenml: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
